name: Publish

# Releases lattice-doe to TestPyPI or PyPI via PyPI Trusted Publishing
# (OIDC) — no API token is stored in this repository's secrets, so there is
# nothing to leak or rotate.
#
# ONE-TIME SETUP, required before the first run of each target:
#   1. PyPI -> Account -> Publishing -> "Add a pending publisher":
#        PyPI project name: lattice-doe
#        Owner: mbagalman        Repository: lattice-doe
#        Workflow name: publish.yml
#        Environment name: pypi
#      Repeat on test.pypi.org with environment name: testpypi
#   2. GitHub -> Settings -> Environments: create `pypi` and `testpypi`.
#      Adding a required reviewer to `pypi` makes every production publish
#      need an explicit human approval, which is the point of splitting the
#      two environments.
#
# USAGE:
#   Dry run     : Actions -> Publish -> Run workflow -> target = testpypi
#   Real release: tag v0.1.0, cut a GitHub Release -> this runs for PyPI
#                 (or Run workflow -> target = pypi)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Index to publish to'
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

# Least privilege by default; only the publish jobs get id-token: write.
permissions:
  contents: read

jobs:
  build:
    name: Build + verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Verify distribution metadata
        # --strict promotes README-rendering warnings to errors: a long
        # description that fails to render leaves a blank PyPI project page,
        # and that cannot be fixed in place — the version would have to be
        # yanked and re-released.
        run: python -m twine check --strict dist/*

      - name: Smoke-install the wheel in a clean venv
        run: |
          python -m venv smoke
          ./smoke/bin/pip install --upgrade pip
          ./smoke/bin/pip install dist/*.whl
          ./smoke/bin/lattice --help
          ./smoke/bin/python -c "import lattice_doe; print('import OK')"

      - name: Confirm the git tag matches the packaged version
        # Guards the one mistake this workflow could make irreversibly:
        # publishing version X under tag vY. PyPI filenames are immutable,
        # so a wrong version number can only be yanked, never replaced.
        if: github.event_name == 'release'
        run: |
          pkg=$(./smoke/bin/python -c "import importlib.metadata as m; print(m.version('lattice-doe'))")
          tag="${GITHUB_REF_NAME#v}"
          echo "packaged version: $pkg"
          echo "git tag:          $GITHUB_REF_NAME (-> $tag)"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packaged version $pkg - bump version in pyproject.toml or retag"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lattice-doe
    permissions:
      id-token: write  # mints the OIDC token Trusted Publishing exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lattice-doe
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
