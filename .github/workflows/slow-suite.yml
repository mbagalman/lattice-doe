name: Slow suite

# The 127 slow tests (test_api, test_api_server integration, test_contrasts,
# test_split_plot) cost ~90 min CPU, so they run on a weekly schedule and on
# demand rather than per-PR (TD-10). This job runs the FULL suite, so the
# coverage it prints is the number that stands behind the whole package —
# the per-PR CI coverage is fast-suite-only and understates slow-tested
# modules (e.g. the api_server routers).

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  slow:
    name: Full suite incl. slow (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package + extras + test deps
        # This is the authoritative coverage run (RV-5/RV-8), so every
        # optional feature group installs — otherwise its suites skip at
        # import and the coverage they enforce is silently absent. [all]
        # covers cli/server/report/viz/extras/app/sheets/widgets in one
        # self-maintaining group (RV-8 caught that the previous explicit
        # list omitted [app], skipping the Streamlit AppTest suite).
        # weasyprint is NOT in [all], deliberately: it needs system
        # libraries the runner lacks, and test_report's PDF test asserts
        # the ImportError guard — which requires weasyprint to be absent.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest pytest-cov pytest-anyio

      - name: Run FULL test suite (fast + slow)
        # --cov passed explicitly: coverage is no longer in pytest addopts
        # (TD-13). This run owns the authoritative coverage number.
        run: pytest --cov=lattice_doe --cov-report=term
