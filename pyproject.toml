[project]
name = "lattice-doe"
version = "0.1.0"
description = "Lattice DOE: power-assured optimal experimental designs for linear and GLM models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Bagalman", email = "michael@paradoxresolution.com" }]
requires-python = ">=3.10"
keywords = [
  "design of experiments",
  "doe",
  "experimental design",
  "optimal design",
  "i-optimal",
  "d-optimal",
  "a-optimal",
  "power analysis",
  "split-plot",
  "fedorov exchange",
  "glm",
  "statistics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
]

# Core dependencies — minimal install required for core API functionality.
#
# UPPER-BOUND POLICY (MT-5, 2026-10-18): this is a library, so it carries no
# speculative upper caps. A cap here propagates to every downstream consumer
# and can make lattice-doe flatly uninstallable alongside another package —
# `pandas<3` plus anything requiring `pandas>=3` is an unsolvable resolution,
# which is strictly worse for the user than a runtime error they could pin
# around themselves. Breakage is caught instead by the weekly slow-suite run,
# which installs `.[all]` UNPINNED and is the canary; add a cap only once a
# break is demonstrated, and cite the evidence in the comment.
#
# The previous `pandas<3` / `patsy<1` caps were removed on evidence, not
# assumption: the full fast suite was run against pandas 3.0.6 + patsy 1.0.3
# + numpy 2.5.4 + scipy 1.18.1 with every extra installed — 1735 passed, 0
# failed, 0 skipped.
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.10",
  "patsy>=0.5"
]

[project.optional-dependencies]
# Optional dependencies for CLI functionality
cli = [
  "pyyaml>=6.0"
]
# Optional dependencies for visualization
viz = [
  "matplotlib>=3.5",
  "seaborn>=0.11",
  "plotly>=5.0",
]
# Optional dependencies for progress bar and Excel output
extras = [
  "tqdm>=4.65",
  "xlsxwriter>=3.0",
  "openpyxl>=3.1"
]
# Optional dependencies for the Streamlit web front-end
app = [
  "streamlit>=1.30",
  "plotly>=5.0",
  "pyyaml>=6.0"
]
# Optional dependencies for HTML report generation
report = [
  "jinja2>=3.0",
  "pillow>=9.0",
  "kaleido>=0.2"
]
# Optional dependencies for PDF report generation (adds weasyprint)
report-pdf = [
  "jinja2>=3.0",
  "pillow>=9.0",
  "kaleido>=0.2",
  "weasyprint>=60.0"
]
# Optional dependencies for Google Sheets integration
sheets = [
  "gspread>=6.0",
  "google-auth>=2.0",
]
# Optional dependencies for the Jupyter ipywidgets UI
widgets = [
  "ipywidgets>=8.0",
  "plotly>=5.0",
]
# Optional dependencies for the FastAPI REST API server
server = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "anyio>=4.0",
]
# Convenience meta-group to install *everything* at once.
#
# This self-references the other extras rather than restating their
# packages. PEP 508 self-referential extras are supported by pip >= 21.2,
# and the previous hand-maintained copy of every dependency had already
# drifted twice: RV-8 caught it omitting [app] (silently skipping the whole
# Streamlit AppTest suite from the authoritative coverage run), and by
# 2026-10-17 it had also lost `anyio` from the server group. One line
# cannot drift.
#
# report-pdf is deliberately EXCLUDED: it adds weasyprint, which needs
# system libraries CI runners lack, and test_report's PDF test asserts the
# ImportError guard — which requires weasyprint to be absent.
all = ["lattice-doe[cli,viz,extras,app,report,sheets,widgets,server]"]

[project.urls]
Homepage = "https://github.com/mbagalman/lattice-doe"
Repository = "https://github.com/mbagalman/lattice-doe"
Issues = "https://github.com/mbagalman/lattice-doe/issues"


[project.scripts]
# Registers a CLI entry point; users can run `lattice` after installation.
lattice = "lattice_doe.cli:main"
# REST API server entry point; users can run `lattice-api` after installation.
lattice-api = "lattice_doe.api_server.main:run"
# Streamlit web UI entry point; users can run `lattice-app` after installing
# the [app] extra.
lattice-app = "lattice_doe.app._launcher:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# The distribution claims exactly ONE top-level import name: lattice_doe.
# The REST server lives at lattice_doe.api_server (a bare top-level
# "api_server" would squat a generic name in every user's environment).
[tool.setuptools.packages.find]
where = ["."]
include = ["lattice_doe*"]

[tool.setuptools.package-data]
# py.typed is the PEP 561 marker: without it, downstream type checkers and
# IDEs treat the fully-annotated package as untyped.
"lattice_doe" = ["templates/*.html", "py.typed"]
# Streamlit surfaces every .py file under pages/ as a sidebar page, so the
# pages directory must NOT be a package (an __init__.py would render as a
# page); its scripts ship as package data instead.
"lattice_doe.app" = ["pages/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is opt-in (pytest --cov=lattice_doe), not in addopts: with it in
# addopts, ANY pytest invocation — including --collect-only — overwrote
# .coverage, silently corrupting real measurements (TD-13). The slow-suite
# CI workflow passes the flags explicitly; it owns the authoritative number.
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "anyio: marks tests to run under anyio backends",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# The rule set is pinned EXPLICITLY rather than inherited from ruff's
# defaults (MT-1). TD-11 drove the ruff count to 0 and CI gates it at
# `RUFF_BASELINE: 0`, but with no config the gate measured whatever the
# pinned `ruff==0.15.12` happened to default to - so the baseline's
# *meaning* was a tool-version artifact, not a project decision. Ruff
# 0.16 widened its defaults (I, C4, UP, B, SIM, TRY, S, BLE, DTZ, RUF):
# the same untouched tree measures 0 on 0.15.12 and ~1,400 on 0.16.4, so
# the next routine tool bump would have detonated the gate. This
# `select` reproduces exactly 0 on both versions.
#
# Only E4/E7/E9/F are enabled. Turning on any further family (UP, I, C4,
# SIM, ...) is a deliberate opt-in, not a default to drift into: each is
# a few-hundred-site mechanical diff that also moves the baseline, so it
# wants its own change. Historical note: UP007/UP045 (`Optional[X]` ->
# `X | None`) were previously excluded because PEP 604 pipes broke
# `typing.get_type_hints()` on Python 3.9 (IA-5). The floor is 3.10 as of
# MT-3, so that hazard is gone and those rules are now merely unadopted.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
# The Streamlit app is PERMANENTLY excluded (TD-12 decision, 2026-08-15),
# not deferred work: pages/ carries non-identifier module names
# (1_Factors.py) that are run, never imported, and the rest of app/ is
# Streamlit-runtime code whose behavior is exercised by the AppTest suite;
# type-checking it would require streamlit in the pinned measurement
# environment for little marginal safety. The REST server (api_server/)
# IS in scope since TD-12 — it is ordinary typed library code.
exclude = ["lattice_doe/app/"]
